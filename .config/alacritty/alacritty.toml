[general]
import = ["theme.toml"]

[terminal.shell]
program = "/usr/bin/fish"

[env]
TERM = "xterm-256color"

[window]
padding = { x = 10, y = 10 }
dynamic_padding = true
decorations = "full"
opacity = 0.9

[font]
normal = { family = "ShareTechMono", style = "Regular" }
bold = { family = "ShareTechMono", style = "Bold" }
italic = { family = "ShareTechMono", style = "Italic" }
size = 11
